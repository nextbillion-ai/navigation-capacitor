apply plugin: 'com.android.library'

def hostValue = { name, fallback -> rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback }

android {
    namespace 'ai.nextbillion.navigation.capacitor'
    compileSdk hostValue('compileSdkVersion', 35)
    defaultConfig {
        minSdk 23
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'ai.nextbillion:nb-navigation-android:3.1.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation "androidx.appcompat:appcompat:${hostValue('androidxAppCompatVersion', '1.7.0')}"
}
